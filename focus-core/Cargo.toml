[package]
name = "focus-core"
version = "0.0.0"
edition = "2024"

[dependencies]
bstr = "1"
# markdown-rs: a CommonMark and GFM parser that is two crates all told,
# needs no build script, and has no unsafe in it. Focus wants the tree and
# the byte offsets on it, not the HTML everything else is for.
markdown = "1"
similar = { version = "3", features = ["bytes"] }

[dev-dependencies]
syn = { version = "3", features = ["full"] }
prettyplease = "0.3"
