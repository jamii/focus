[common]
version = 2
build_flags = ["--locked"]

# APIs that observe or change the world without going through focus_core::IO.
# High-level std paths catch ordinary Rust code; the C ABI names catch crates
# that bypass std and call the operating system directly.
[api.ambient_io]
include = [
    "std::env",
    "std::fs",
    "std::io::stdio",
    "std::net",
    "std::os::linux::fs",
    "std::os::unix::fs",
    "std::os::unix::io",
    "std::os::unix::net",
    "std::process::Command",
    "std::process::Stdio",
    "accept",
    "accept4",
    "access",
    "bind",
    "chdir",
    "chmod",
    "chown",
    "clock_gettime",
    "close",
    "closedir",
    "connect",
    "creat",
    "creat64",
    "dup",
    "dup2",
    "dup3",
    "epoll_create",
    "epoll_create1",
    "epoll_ctl",
    "epoll_pwait",
    "epoll_wait",
    "eventfd",
    "eventfd2",
    "execve",
    "faccessat",
    "fchdir",
    "fchmod",
    "fchmodat",
    "fchown",
    "fchownat",
    "fclose",
    "fcntl",
    "fdatasync",
