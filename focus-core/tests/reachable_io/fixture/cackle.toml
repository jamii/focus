# HashMap/HashSet constructors using RandomState eventually call getrandom (or
# open /dev/random on older targets). Cackle splits generic symbols at `<`, so
# matching the types is deliberately broad; the snapshot test keeps only the
# construction call sites from this category.
[api.random_hash_seed]
include = [
    "std::collections",
    "std::collections::hash::map::HashMap",
    "std::collections::hash::set::HashSet",
    "std::hash::RandomState",
    "std::hash::random::RandomState",
]

# Unsafe is outside this test's scope. These dependencies use it internally;
# their ambient-I/O references remain checked above.
[pkg.bstr]
allow_unsafe = true

[pkg.memchr]
allow_unsafe = true

[pkg.regex-automata]
allow_unsafe = true

# bstr exposes an optional serde feature. Cackle validates the package graph,
# including optional proc-macro dependencies, even though this fixture doesn't
# enable that feature.
[pkg.serde_derive]
allow_proc_macro = true
