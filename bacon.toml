# Default `bacon` (no args) runs the editor and restarts it on any change
# under src/ or Cargo.toml.
default_job = "run"

[jobs.run]
command = ["cargo", "run", "--color", "always"]
need_stdout = true
allow_warnings = true
# Kill the running process the moment a file changes, then rebuild + relaunch.
on_change_strategy = "kill_then_restart"

[jobs.test]
command = ["cargo", "test", "--color", "always"]
need_stdout = true
